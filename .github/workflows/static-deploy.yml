name: Deploy Static WordPress Site

on:
  push:
    branches:
      - main  # Change this to whatever branch Staatic pushes to

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: generic

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # If Staatic pushes files into a nested subfolder, change "." to that folder name (e.g., "./static-export")
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
